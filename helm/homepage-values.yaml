# homepage-values.yaml
# Helm chart: jameswynn/homepage
# Install with:
#   helm repo add jameswynn https://jameswynn.github.io/helm-charts
#   helm repo update
#   kubectl create namespace homepage
#   helm install homepage jameswynn/homepage -n homepage -f homepage-values.yaml
#
# Before applying, run:
#   helm template homepage jameswynn/homepage -n homepage -f homepage-values.yaml
# and check for "warning: skipped value" / "cannot overwrite table" lines --
# these mean a key's type doesn't match what the chart expects and the
# override was silently dropped.

# --- Expose Homepage on your local network ---
# k3s ships with its own ServiceLB ("Klipper LB"), so LoadBalancer works
# out of the box without installing MetalLB.
service:
  main:
    type: LoadBalancer
    ports:
      http:
        port: 3000

# --- No persistence needed ---
# Homepage is stateless: it reads config.yaml, services.yaml, widgets.yaml,
# settings.yaml, and bookmarks.yaml from files mounted via ConfigMap below.
persistence:
  config:
    enabled: false

# --- Required: allowed Host headers ---
# Homepage (Next.js) rejects requests whose Host header isn't in this list,
# regardless of network-level access. This is NOT a network privacy control --
# it only stops Homepage's own app code from erroring on valid LAN requests.
# The chart expects a LIST of {name, value} pairs here, not a map -- a map
# gets silently skipped ("Not a table" warning from helm template).
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "192.168.1.9:3000,192.168.1.10:3000"   # <-- replace with your actual node IP

  - name: HOMEPAGE_VAR_PLEX_TOKEN
    valueFrom:
      secretKeyRef:
        name: homepage-plex-token
        key: PLEX_TOKEN

# --- RBAC: lets the Kubernetes widget read cluster/pod/node status ---
# Verified directly against chart source (templates/_rbac.yaml): this is
# NOT "rbac.create" -- it's a flat top-level boolean called "enableRbac".
# The old rbac: {create: true} block was silently a no-op, which is why
# the widget got a 403 "nodes is forbidden" error despite RBAC "looking"
# configured.
enableRbac: true
serviceAccount:
  create: true

# --- Homepage's own config files ---
# IMPORTANT: give these as native YAML structures (maps/lists), NOT raw
# multi-line strings via "|". The chart runs each value through toYaml to
# write it into the ConfigMap. If you hand it an already-stringified block,
# toYaml treats that string as an opaque blob and wraps another
# block-scalar marker around it, producing literal "|" text in the file
# instead of real YAML content -- confirmed via `helm template` output.
#
# Adding this section back in one step at a time (services only, for now)
# after confirming the chart's own defaults render fine without it.
config:
  # Required for the Kubernetes info widget below to have permission to
  # query the cluster API from inside the pod (uses the RBAC/serviceAccount
  # already enabled further up in this file).
  kubernetes:
    mode: cluster

  # config.widgets = page-level "info widgets" (resource stats, weather,
  # etc.) shown at the top of the page -- different from config.services
  # below, where per-app tiles live.
  widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  # config.services = tiles on the page. A service can optionally carry a
  # "widget" block for LIVE data (now playing, library stats, etc.) pulled
  # from that app's own API -- this is different from config.widgets, which
  # is only for page-level info widgets (resource stats, weather...).
  #
  # Starting simple: link-only tile, no widget/API key, so nothing
  # sensitive ends up in this file before it's pushed to GitHub.
  services:
    - Network:
        - Technitium DNS:
            icon: technitium.png
            href: http://192.168.1.6:5380
            description: Local DNS server

    - Media:
        - Plex:
            icon: plex.png
            href: http://192.168.1.10:32400/web
            description: Media server
            widget:
              type: plex
              url: http://192.168.1.10:32400
              key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"

